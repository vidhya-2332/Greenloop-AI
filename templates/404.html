{% extends "base.html" %}

{% block title %}Page Not Found – GreenLoop AI{% endblock %}

{% block content %}
<section class="error-page">
    <div class="container text-center">
        <div class="error-box">
            <span class="error-badge">404</span>
            <h1>Page Not Found</h1>
            <p>The page or waste category you requested could not be found.</p>
            <a href="{{ url_for('home') }}" class="btn btn-primary mt-3">
                <i class="fa-solid fa-house"></i> Return to GreenLoop Home
            </a>
        </div>
    </div>
</section>
{% endblock %}
